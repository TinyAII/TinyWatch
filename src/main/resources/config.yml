# ============================================================
#  TinyWatch —— 网页监控面板
#
#  改完配置后执行 /watch 重载 即可生效（不用重启服务器）。
# ============================================================

web:
  enabled: true

  # 监听地址。
  #   0.0.0.0    = 允许外网直连（默认，装完用 http://服务器IP:端口 就能打开）
  #   127.0.0.1  = 只有本机能访问。前面挂了 nginx 反代、或者走 SSH 隧道时改成这个
  #
  # 注意：0.0.0.0 + HTTP 意味着登录密码和会话在网络上是明文的。
  # 长期对外用，建议改成 127.0.0.1 再套一层 nginx + HTTPS（见 README「怎么从外网访问」）。
  host: "0.0.0.0"

  port: 8123

  # 登录密码。
  # 留空 = 首次启动自动生成一个随机密码，只打印一次在控制台。
  # 服务器上只存它的 PBKDF2 哈希（见下面的 password-hash），配置文件里没有明文。
  # 忘了密码：游戏里 /watch 新密码 重新生成一个。
  #
  # 如果你在这里手写明文，启动时会自动转成哈希并把这一行清空（原文件备份为 config.yml.bak）。
  password: ""

  # 密码哈希，自动生成，不要手改。
  password-hash: ""

  # 是否信任反向代理传来的 X-Forwarded-For。
  # 只有前面挂了 nginx/Caddy 这类反代、并且监听 127.0.0.1 时才打开。
  # 直连公网时保持 false —— 否则别人可以伪造这个头绕过登录限流。
  trust-proxy: false

  # 登录有效期（小时）。到期需要重新登录。
  session-hours: 12

  # 是否在网页上显示玩家 IP。
  # 默认 false —— IP 属于玩家隐私，面板一般只需要看坐标和血量。
  show-ip: false

  # ---- 物品图标 ------------------------------------------------
  # 背包格子里画什么。
  #
  #   honghemc = 用「红河素材站」的高清图标（默认）。
  #              插件里打包了一张 2118 个物品的「名称 -> 图片路径」映射表
  #              （gzip 后 22 KB，启动时读一次，服务器不解析、不占常驻内存），
  #              浏览器拿到映射后自己去图床取图，按天缓存。
  #              取不到图会自动退回下面的 svg 图标，不会出现空白格子。
  #
  #   svg      = 完全离线的手绘矢量图标，零外部请求。
  #              适合内网 / 无外网的服务器。
  #
  #   none     = 只显示纯色块 + 中文名，最省。
  item-icons: "honghemc"

  # honghemc 模式下取图的前缀（一般不用改）
  item-icon-base: "https://honghemc.cn/thumbs/images/"

  # 兼容项：如果你自己搭了图床，把 item-icons 改成 cdn 并改这里，{item} 换成小写物品 id
  item-icon-cdn: "https://mc-heads.net/item/{item}"

  # ---- 网页上的管理操作 ----------------------------------------
  #
  # ⚠️ 打开之后，网页就不只是「看」了，它变成了「管」。
  #    登录密码泄露的后果，从「别人知道你在干什么」升级成
  #    「别人能踢你的人、封你的人、执行命令」。
  #
  #    以下几个前提缺一不可：
  #      1. 一定要用 HTTPS（http 明文传密码，等于没有密码）
  #      2. 密码别用你常用的那几个，定期换
  #      3. 每次操作都会写进操作日志（类型 ADMIN），出事了能查
  #
  #    不想要任何风险的话，把 enabled 改成 false，面板退回纯只读。
  actions:
    enabled: true

    # 以下都是低风险操作，默认开
    message: true        # 给玩家发一条管理员消息
    teleport: true       # 把玩家传送到指定坐标
    kick: true           # 踢出（可带原因）
    vanish: true         # 切旁观模式（隐形巡查），再点一次切回原模式
    heal: true           # 回满血 + 喂饱 + 清负面效果
    gamemode: true       # 切换生存/创造/冒险/旁观
    clear-items: true    # 清理玩家周围 32 格的掉落物

    # 封禁：唯一「不可逆」的操作（要 /pardon 才能解），默认关闭
    ban: false

    # 执行命令：危险等级最高，默认关闭。
    # 白名单为空时该功能不可用；{player} 会被替换成目标玩家名。
    # 例子：command: true + 白名单里加 give / effect
    command: false
    command-whitelist: []

    # 下面这些是「成组」的开关，一组管一批按钮（免得这里堆二十多行）
    # 关掉之后对应那一组按钮点了会提示「未开启」
    state: true          # 状态：清/给药水效果、经验等级、飞行、隐身
    items: true          # 物品：清空背包、给物品、修耐久、拿走某格、清周围掉落物
    position: true       # 位置：传到某玩家、送回出生点、冻结、记录坐标与拉回
    notify: true         # 沟通：屏幕标题、动作栏、音效
    moderate: true       # 处罚：禁言、白名单、OP
    economy: true        # 经济：查余额、给/扣（需要装 Vault 且经济插件已注册）

  # ---- 世界修改（顶部「世界」页签）----
  world:
    enabled: true        # 总开关：时间 / 天气 / 难度 / 游戏规则 / 出生点 / 保存
    clear: true          # 清理类：清掉落物、清生物（删了收不回来，单独开关）
    border: true         # 世界边界（改小了会把玩家往内推，慎用）


monitor:
  # 采样间隔（tick）。20 tick = 1 秒。
  #
  # 这是本插件唯一持续占用 CPU 的地方，而且开销很小（读几个字段 + 每秒一个对象）。
  # 想更省可以调到 40（2 秒一采）：
  #   实时性略降，但曲线和数字依然够看，CPU 占用再减半。
  # 低于 10 没有意义，服务器 tick 本身就只有 20 次。
  sample-interval-ticks: 20

  # 保留多少个采样点用于画曲线。
  # 300 个 × 1 秒 = 最近 5 分钟。内存占用约 300 × 48 字节，可以忽略。
  history-size: 300

  # 实体数 / 已加载区块数这两项要遍历所有世界，开销比读玩家数据大，
  # 所以不是每次采样都统计 —— 每 N 次采样刷新一次。
  # 5 次 = 5 秒刷新一次，界面上这两个数字会稍微滞后，属于正常。
  # 大服（上千实体）可以调到 10 甚至 20，这两项就变成 10~20 秒刷一次。
  slow-stat-every-samples: 5


# ---- 想再省一点的话（照抄即可）----------------------------------
#   monitor:
#     sample-interval-ticks: 40        # 2 秒一采
#     history-size: 150                # 曲线只留 5 分钟 -> 2.5 分钟
#     slow-stat-every-samples: 20      # 实体/区块 20 秒统计一次
#
# 注意：本插件不缓存任何历史数据到磁盘、不持有玩家对象、
# 所有缓冲都是定长的（日志 5000 条、曲线 300 点，写满就挤掉最旧的）。
# 如果你的堆在涨，先看 /watch 状态 里的数字有没有超过上限 ——
# 绝大多数情况下涨的是 Minecraft 自己的区块缓存，不是这个插件。


# ── 预警 ──
# 顶部横幅：现在哪里不正常。恢复正常后自动消失。
alerts:
  enabled: true
  tps-below: 15          # TPS 低于多少（连续 3 次采样）就报警
  memory-percent: 85     # 堆占用超过百分之多少就报警
  entities-above: 4000   # 全服实体数超过多少就报警（通常是掉落物堆积）
  break-per-minute: 100  # 单个玩家 1 分钟内破坏超过多少块就报警

  # 聊天关键词：命中的话在「聊天」页签标红一条警报（不拦消息本身）
  # 比如广告、拉人、服务器名之类，按你的服情况填
  keywords: []
  # 命中关键词自动禁言多少分钟（0 = 只标红，不处罚自己）
  keyword-mute-minutes: 0

# ── 计划任务 ──
# at: "HH:mm" 每天这个点跑；every: "30m" 每隔一段时间跑（s / m / h）
# do 只能是：broadcast（广播 text）/ save（保存世界）/ clear-items（清掉落物）/ restart（关服）
tasks:
  enabled: true
  jobs: []
  # 例子（把 jobs 换成下面这种）：
  # jobs:
  #   - at: "04:00"
  #     do: save
  #   - at: "12:00"
  #     do: broadcast
  #     text: "&e中午好，服务器每天 12 点提醒一次"
  #   - every: "30m"
  #     do: clear-items

events:
  enabled: true

  # 内存里最多保留多少条操作日志（先进先出，满了挤掉最旧的）。
  # 一条大约 120 字节，5000 条约 600 KB。
  # 注意：这些日志只存在内存里，重启服务器就清空了。
  buffer-size: 5000

  # 记录哪些类型的操作。关掉不想要的可以减少开销。
  record:
    block-break: true      # 方块被破坏
    block-place: true      # 方块被放置
    container: true        # 打开容器（箱子/桶/熔炉…）
    container-click: false # 容器内点击取放物品（事件量大，默认关）
    command: true          # 执行命令
    chat: true             # 玩家发言（世界聊天），网页「聊天」页签和玩家日志都会用到
    death: true            # 死亡
    join-quit: true        # 进出服务器

  # 抓「聊天框里的系统消息」：服务器公告、广播、控制台 /say 之类的输出。
  # 靠读服务端日志实现（运行时挂一个 log4j2 Appender），挂不上就自动降级成只记玩家聊天。
  # 插件自己的 INFO 日志不会进来（那是控制台噪声，玩家看不到），只有 WARN/ERROR 会进「插件提示」。
  capture-console: true

  # 不记录的坐标（用于排除刷怪塔、自动农场这类高频区域）。
  # 支持世界名，格式：world_name:x,z  或只写世界名排除整个世界
  ignore-worlds: []

  # 不记录的命令（只写命令本身，不带斜杠）。
  # 默认屏蔽登录类命令 —— 它们的参数里有明文密码，
  # 记进日志等于把密码写在了网页上。
  ignore-commands:
    - login
    - l
    - register
    - reg
    - changepassword
    - cp
    - passwd
    - password


# ---- 在线更新检查 ------------------------------------------------
# 启动后异步查一次有没有新版本，之后每 N 小时一次。失败静默、不拖慢启动。
# 只提示，不下载、不替换 jar。
update-check:
  enabled: true
  endpoint: "https://bump.tinyaii.cn"
  app-key: "app_4192c1abdbfb0677b688f11f"
  channel: "stable"
  timeout-seconds: 3
  interval-hours: 6
  # 拥有该权限的人上线时会收到「有新版本」提示
  notify-permission: "tinywatch.admin"
